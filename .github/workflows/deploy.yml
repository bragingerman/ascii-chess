name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    # Forks and copies without the Cloudflare secrets skip the job instead of failing.
    env:
      HAS_CF: ${{ secrets.CLOUDFLARE_API_TOKEN != '' }}
    steps:
      - uses: actions/checkout@v4
        if: env.HAS_CF == 'true'
        with:
          lfs: true
      - uses: pnpm/action-setup@v4
        if: env.HAS_CF == 'true'
        with:
          version: 10
      - uses: actions/setup-node@v4
        if: env.HAS_CF == 'true'
        with:
          node-version: 22
          cache: pnpm
      - if: env.HAS_CF == 'true'
        run: pnpm install --frozen-lockfile
      - if: env.HAS_CF == 'true'
        run: pnpm typecheck
      - if: env.HAS_CF == 'true'
        run: pnpm exec vite build
      - if: env.HAS_CF == 'true'
        run: pnpm exec wrangler deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
